name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run bench

  # Re-runs the Gemini CLI study and fails if the committed RESULTS.md no longer matches.
  gemini-cli-study:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci
        working-directory: study/gemini-cli
      - run: npx tsc -p study/gemini-cli
      - run: npm run study
        working-directory: study/gemini-cli
      - run: git diff --exit-code study/gemini-cli/RESULTS.md

  # Builds a small harness against Codex CLI's own Rust crates at a pinned release, regenerates
  # its verdicts, and fails if they or RESULTS.md no longer match what's committed.
  codex-cli-study:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: openai/codex
          ref: rust-v0.163.0
          path: .codex-src
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsx study/codex-cli/score.ts --export
      - name: Build the harness inside the Codex workspace
        run: |
          cp -R study/codex-cli/harness .codex-src/codex-rs/gbb-harness
          sed -i 's/^members = \[/members = [\n    "gbb-harness",/' .codex-src/codex-rs/Cargo.toml
          cd .codex-src/codex-rs && cargo build -p gbb-harness
      - name: Ask Codex's code for a verdict on every command
        run: |
          H=.codex-src/codex-rs/target/debug/gbb-harness
          $H study/codex-cli/deny.rules never study/codex-cli/commands.json > study/codex-cli/verdicts-deny.json
          $H study/codex-cli/allow.rules unless-trusted study/codex-cli/commands.json > study/codex-cli/verdicts-allow.json
          cat study/codex-cli/verdicts-deny.json study/codex-cli/verdicts-allow.json
      - run: npx tsx study/codex-cli/score.ts
      - name: Fail if the committed study no longer matches
        run: |
          git status --porcelain study/codex-cli
          test -z "$(git status --porcelain study/codex-cli)"

  # Runs opencode's real shell tool and permission code (inside a checkout of the tagged release)
  # on every benchmark command, regenerates the verdicts, and fails if they or RESULTS.md change.
  opencode-study:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: anomalyco/opencode
          ref: v1.19.4
          path: .opencode-src
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: npm ci
      - run: npx tsx study/opencode/score.ts --export
      - run: bun install
        working-directory: .opencode-src
      - name: Ask opencode's code for a verdict on every command
        run: |
          cp study/opencode/harness/gbb.test.ts .opencode-src/packages/opencode/test/tool/gbb.test.ts
          cd .opencode-src/packages/opencode
          GBB_COMMANDS="$GITHUB_WORKSPACE/study/opencode/commands.json" GBB_OUT="$GITHUB_WORKSPACE/study/opencode" \
            bun test test/tool/gbb.test.ts --timeout 120000
          for f in patterns verdicts-deny verdicts-allow; do echo "=== $f"; cat "$GITHUB_WORKSPACE/study/opencode/$f.json"; done
      - run: npx tsx study/opencode/score.ts
      - name: Fail if the committed study no longer matches
        run: |
          git status --porcelain study/opencode
          test -z "$(git status --porcelain study/opencode)"
