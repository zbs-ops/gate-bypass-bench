name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run bench

  # Re-runs the Gemini CLI study and fails if the committed RESULTS.md no longer matches.
  gemini-cli-study:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci
        working-directory: study/gemini-cli
      - run: npx tsc -p study/gemini-cli
      - run: npm run study
        working-directory: study/gemini-cli
      - run: git diff --exit-code study/gemini-cli/RESULTS.md

  # Builds a small harness against Codex CLI's own Rust crates at a pinned release, regenerates
  # its verdicts, and fails if they or RESULTS.md no longer match what's committed.
  codex-cli-study:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: openai/codex
          ref: rust-v0.163.0
          path: .codex-src
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsx study/codex-cli/score.ts --export
      - name: Build the harness inside the Codex workspace
        run: |
          cp -R study/codex-cli/harness .codex-src/codex-rs/gbb-harness
          sed -i 's/^members = \[/members = [\n    "gbb-harness",/' .codex-src/codex-rs/Cargo.toml
          cd .codex-src/codex-rs && cargo build -p gbb-harness
      - name: Ask Codex's code for a verdict on every command
        run: |
          H=.codex-src/codex-rs/target/debug/gbb-harness
          $H study/codex-cli/deny.rules never study/codex-cli/commands.json > study/codex-cli/verdicts-deny.json
          $H study/codex-cli/allow.rules unless-trusted study/codex-cli/commands.json > study/codex-cli/verdicts-allow.json
          cat study/codex-cli/verdicts-deny.json study/codex-cli/verdicts-allow.json
      - run: npx tsx study/codex-cli/score.ts
      - name: Fail if the committed study no longer matches
        run: |
          git status --porcelain study/codex-cli
          test -z "$(git status --porcelain study/codex-cli)"

  # Runs opencode's real shell tool and permission code (inside a checkout of the tagged release)
  # on every benchmark command, regenerates the verdicts, and fails if they or RESULTS.md change.
  opencode-study:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: anomalyco/opencode
          ref: v1.19.4
          path: .opencode-src
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: npm ci
      - run: npx tsx study/opencode/score.ts --export
      - run: bun install
        working-directory: .opencode-src
      - name: Ask opencode's code for a verdict on every command
        run: |
          cp study/opencode/harness/gbb.test.ts .opencode-src/packages/opencode/test/tool/gbb.test.ts
          cd .opencode-src/packages/opencode
          GBB_COMMANDS="$GITHUB_WORKSPACE/study/opencode/commands.json" GBB_OUT="$GITHUB_WORKSPACE/study/opencode" \
            bun test test/tool/gbb.test.ts --timeout 120000
          for f in patterns verdicts-deny verdicts-allow; do echo "=== $f"; cat "$GITHUB_WORKSPACE/study/opencode/$f.json"; done
      - run: npx tsx study/opencode/score.ts
      - name: Fail if the committed study no longer matches
        run: |
          git status --porcelain study/opencode
          test -z "$(git status --porcelain study/opencode)"

  # What Gemini CLI, Codex and opencode do with a tool call when the safety hook crashes, times
  # out, or answers in a way they don't support. Each agent's own code decides, at a pinned version.
  hook-failure-study:
    runs-on: ubuntu-latest
    env:
      GEMINI_CLI_REF: cd1b45c2db0a5ea7b7fc3b67c1ba5879601d6005
      CODEX_REF: 970111f6cb62cc02fe36a82ea7d71b37a2889c97
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: google-gemini/gemini-cli
          ref: ${{ env.GEMINI_CLI_REF }}
          path: .gemini-src
      - uses: actions/checkout@v4
        with:
          repository: openai/codex
          ref: ${{ env.CODEX_REF }}
          path: .codex-src
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci --ignore-scripts
        working-directory: .gemini-src
      - name: Gemini CLI's hook runner on each behaviour
        run: |
          cp study/hook-failures/gemini.hook-failures.test.ts .gemini-src/packages/core/src/hooks/
          cd .gemini-src/packages/core
          HOOK_STUDY_CASES="$GITHUB_WORKSPACE/study/hook-failures/cases.json" HOOK_STUDY_OUT="$RUNNER_TEMP/gemini.json" \
            npx vitest run src/hooks/gemini.hook-failures.test.ts --coverage.enabled=false --silent=false
          cat "$RUNNER_TEMP/gemini.json"
      - run: python3 study/hook-failures/inject.py .codex-src/codex-rs/hooks/src/events/pre_tool_use.rs
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .codex-src/codex-rs
      - name: Codex's PreToolUse parser on each behaviour
        working-directory: .codex-src/codex-rs
        run: |
          HOOK_STUDY_OUT="$RUNNER_TEMP/codex.json" cargo test -p codex-hooks --lib hook_failure_study -- --nocapture
          cat "$RUNNER_TEMP/codex.json"
      - uses: actions/checkout@v4
        with:
          repository: anomalyco/opencode
          ref: v1.19.4
          path: .opencode-src
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install
        working-directory: .opencode-src
      - name: opencode's plugin loader and trigger on each behaviour
        run: |
          cp study/hook-failures/opencode.hook-failures.test.ts .opencode-src/packages/opencode/test/plugin/
          cd .opencode-src/packages/opencode
          HOOK_STUDY_OUT="$RUNNER_TEMP/opencode.json" bun test test/plugin/opencode.hook-failures.test.ts --timeout 60000
          cat "$RUNNER_TEMP/opencode.json"
      - run: npx tsx study/hook-failures/render.ts "$RUNNER_TEMP/gemini.json" "$RUNNER_TEMP/codex.json" "$RUNNER_TEMP/opencode.json"
      - name: Fail if the committed study no longer matches
        run: |
          git status --porcelain study/hook-failures
          test -z "$(git status --porcelain study/hook-failures)"
